<h2 mat-dialog-title>Pesquisa Evento</h2>
<mat-dialog-content>
  <div class="busca">
    <mat-form-field>
      <mat-label>Campo de busca</mat-label>
      <mat-select
        [value]="campoSelecionado()"
        (selectionChange)="campoSelecionado.set($event.value)"
      >
        <mat-option value="idEvento">ID Evento</mat-option>
        <mat-option value="codEvento">Cod. Evento</mat-option>
        <mat-option value="descricao">Descrição</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Valor</mat-label>
      <input matInput #campoBusca />
    </mat-form-field>

    <button mat-flat-button color="primary" type="button" (click)="listar(campoBusca.value)">
      Listar
    </button>
  </div>

  <table mat-table [dataSource]="eventos()">
    <ng-container matColumnDef="idEvento">
      <th mat-header-cell *matHeaderCellDef>ID Evento</th>
      <td mat-cell *matCellDef="let evento">{{ evento.idEvento }}</td>
    </ng-container>

    <ng-container matColumnDef="codEvento">
      <th mat-header-cell *matHeaderCellDef>Cod. Evento</th>
      <td mat-cell *matCellDef="let evento">{{ evento.codEvento }}</td>
    </ng-container>

    <ng-container matColumnDef="descricao">
      <th mat-header-cell *matHeaderCellDef>Descrição</th>
      <td mat-cell *matCellDef="let evento">{{ evento.descricao }}</td>
    </ng-container>

    <ng-container matColumnDef="dtInicio">
      <th mat-header-cell *matHeaderCellDef>Dt.Início</th>
      <td mat-cell *matCellDef="let evento">{{ evento.dtInicio | date: 'dd/MM/yyyy' }}</td>
    </ng-container>

    <ng-container matColumnDef="dtFim">
      <th mat-header-cell *matHeaderCellDef>Dt.Fim</th>
      <td mat-cell *matCellDef="let evento">{{ evento.dtFim | date: 'dd/MM/yyyy' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumnsEventos"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumnsEventos"
      (click)="selecionarEvento(row)"
      [class.selecionado]="eventoSelecionado() === row"
    ></tr>
  </table>
  <div class="paginacao">
    <button mat-stroked-button type="button" disabled>Anterior</button>
    <span>Página 1</span>
    <button mat-stroked-button type="button" disabled>Próxima</button>
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button type="button" (click)="dialogRef.close()">Fechar</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="!eventoSelecionado()"
    (click)="confirmar()"
  >
    OK
  </button>
</mat-dialog-actions>
